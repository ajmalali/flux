name = "paul"
title = "PAUL — the incumbent framework flux was distilled from"
notes = """
PAUL's own lifecycle: init the project, then plan -> audit -> apply -> verify per
phase, each in its own session, with .paul/ carrying state between them. This is
the arm flux has to beat on cost while matching on delivery, because the five flux
lifecycle skills are distilled from these exact workflows.

The framework payload is NOT vendored into this repo -- it is copied from
$FRAMEWORKS/paul at bootstrap. Run bench/setup-frameworks.sh once to populate it.
"""
setting_sources = "project"

[[bootstrap]]
kind = "shell"
label = "install"
command = "test -d ${FRAMEWORKS}/paul && cp -R ${FRAMEWORKS}/paul/. . || { echo 'PAUL not staged; run bench/setup-frameworks.sh' >&2; exit 1; }"

[[bootstrap]]
kind = "session"
label = "init"
prompt = """/paul:init This is a new project. Read README.md and CLAUDE.md to understand it, then initialise PAUL state for it."""

[[step]]
label = "plan"
prompt = """/paul:plan Read {brief_path} in the repository root — that is the phase to plan."""

[[step]]
label = "audit"
prompt = """/paul:audit"""

[[step]]
label = "apply"
prompt = """/paul:apply The plan is approved. Execute it."""

# PAUL's loop is plan -> audit -> apply -> UNIFY. `/paul:unify` is "reconcile plan
# vs actual and close the loop"; `/paul:verify` is "guide manual user acceptance
# testing" -- an interactive command, and the wrong one to end a headless phase
# with. meridian-003 ran `verify` here and PAUL scored 1/4: it delivered m1, then
# every later plan session hit its own precondition check ("the previous loop
# isn't closed -- UNIFY has not run"), asked which way to go, and ended. Four
# sessions of real cost and a zero-line diff, three times over. That is this
# arm's bug, not PAUL's result. It also makes the arm a true mirror of flux's
# plan -> audit -> apply -> wrap, which is the comparison the bench exists for.
[[step]]
label = "unify"
prompt = """/paul:unify"""
