name = "vanilla"
title = "Vanilla Claude Code (no framework)"
notes = """
The control. No plugin, no seeded files, no procedure -- one session per task,
handed the brief and told how to verify. This is what every other arm has to beat,
and it is deliberately given every advantage a framework-free session can have:
the same permissions, the same gate, and an explicit instruction to keep working
until the gate passes. A weak control would flatter everything else.
"""
setting_sources = "project"

[[step]]
label = "implement"
prompt = """Read {brief_path} in the repository root. Implement everything it asks for, completely.

Verify your work by running: {gate}

Do not stop until that command passes and the brief is fully satisfied."""
