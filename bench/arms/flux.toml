name = "flux"
title = "flux v2 — the default path (prime + apply, one session)"
notes = """
What flux does by default as of 2026-08-22: the SessionStart hook primes the
session from .flux/state.toml, one session applies the work, `flux check` closes
it. Same plugin and same budgeted state as the full lifecycle, one session per
task like vanilla.

It was `flux-lite` until it won. Run as the control *within* flux, it separated
two claims that are easy to conflate -- what the deterministic machinery is worth
against what the four-session ceremony costs on top of it -- and it matched the
full arm's delivery at a third of the price in both meridian-003 and
meridian-004. plan.md's falsifiability rule made that the default; the ceremony
survives as `flux-full`, invoked deliberately rather than by procedure.
"""
plugin_dirs = ["${FLUX_REPO}"]

[[bootstrap]]
kind = "shell"
label = "flux-init"
command = "python3 ${FLUX_REPO}/bin/flux init"

[[step]]
label = "apply"
prompt = """Read {brief_path} in the repository root. Implement everything it asks for, completely.

Iterate with `flux run --filter failures -- <scoped test command>`; close with `flux check`.
Do not stop until `flux check` passes and the brief is fully satisfied.
Then record what changed with `flux state set` so the next session starts from it."""
