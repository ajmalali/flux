phase = "Phase 02 closed. ADR 0001 designed and its prerequisite now measured; nothing of the execution index is built yet."
position = "ADR 0001's premise — quality decays with context — was measured on 414 transcripts / 16,909 tool calls / 344 sessions and DID NOT SURVIVE. There is no knee. Correctness (Edit failing on a stale string or an unread file) is FLAT within a model family across 75k-300k+; the pooled 2.9x at p=0.004 is Simpson's paradox, since sonnet/haiku sessions never exceed 200k. What does rise is RE-ORIENTATION: re-reading a file already among the last five read roughly triples across ~100k, same direction within-session at every cut (sign-test p=0.09 at 200k). Naive churn rises only because the touched set grows; 57% of raw tool errors are permission friction clustered at session start. So a long context costs re-reading, not correctness. Acted on: ADR 0001 rule 2 refuses -> WARNS, ledger metric changed to re-read rate; plan.md amended (targets table may no longer assert decay; Tool error rate row footnoted as friction). Shipped bench/fluxbench/decay.py + ./bench/run.py decay + 15 tests. Write-up: .flux/analysis/2026-08-22-context-decay.md"
next = "Build flux task (local execution index + topological next) per ADR 0001 — rule 2 is now a warning, not a refusal, threshold ~100k. Ledger metric: cold-start ramp. Cheap fix first: bench reports permission friction as a quality column (metrics.tool_error_rate) — classify with decay.classify_error and split the column in report.py."
