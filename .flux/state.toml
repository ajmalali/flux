position = "meridian-003 verdict: flux 4/4 at $2.92/task over 4 sessions; flux-lite 4/4 at $1.05 in 1; vanilla 4/4 at $1.05. Every arm scored 82/82. Read honestly, that kills the lifecycle by the falsifiability rule — BUT every meridian task fits one session and everyone hit 100%, so the corpus can only rank cost and decomposition machinery had nothing to decompose. Diagnosis: flux's declared big-feature altitude (wayfinder -> to-spec -> to-tickets -> plan per ticket) has no spine. plan writes only the first phase; the rest of the decomposition dies with the planning session; state.toml carries five prose fields and no edges/remainder; bin/flux cannot read a single to-tickets file. So every cold session re-derives the frontier by reading. ADR 0001 (.flux/adr/0001-execution-frontier.md) moves that topological sort into the CLI, adds a refused task-size budget, size-conditional ceremony, and recorded-done; plan.md's ticket-store exclusion is qualified (tracker still out, local execution index in). 117 tests green."
